name: Shared pilot queue (disposable database only)
on:
  push:
    branches: [feature/pilot-outbox-20261011]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pilot_test
          POSTGRES_PASSWORD: disposable-ci-only-not-an-app-password
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Regression and leased canonical workbook jobs
        env:
          CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          cat supabase/tests/bootstrap.sql \
              supabase/migrations/2026101101_team.sql \
              supabase/migrations/2026101102_catalog.sql \
              supabase/migrations/2026101104_access.sql \
              supabase/tests/access.sql \
              supabase/migrations/2026101105_shared_workbook.sql \
              supabase/migrations/2026101106_draft_sync.sql \
              supabase/tests/draft_sync.sql \
              supabase/migrations/2026101107_pilot_jobs.sql \
              supabase/tests/pilot_jobs.sql \
            | docker exec -i "$CONTAINER_ID" psql -X -U postgres -d pilot_test -v ON_ERROR_STOP=1
