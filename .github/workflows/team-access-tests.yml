name: Team access isolation (no deployment)
on:
  push:
    branches: [feature/team-access-20plus1-20261011]
  pull_request:
    paths: ['supabase/**', 'dist/team-access.mjs', 'tests/security/**', '.github/workflows/team-access-tests.yml']
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: access_test
          POSTGRES_PASSWORD: disposable-ci-only-not-an-app-password
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and assert employee isolation
        env:
          CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          cat supabase/tests/bootstrap.sql \
              supabase/migrations/2026101101_team.sql \
              supabase/migrations/2026101102_catalog.sql \
              supabase/migrations/2026101104_access.sql \
              supabase/tests/access.sql \
            | docker exec -i "$CONTAINER_ID" psql -X -U postgres -d access_test -v ON_ERROR_STOP=1
